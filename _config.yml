# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "HuBot Lab"
title: "Human-Centered Robotics & Physical Intelligence"
institution: "School of Electronic Engineering, Soongsil University"
email: donghwi@ssu.ac.kr
photo: donghwi-jung.jpg

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=cplvY6oAAAAJ"
  github: "https://github.com/donghwijung"
  website: "https://donghwijung.github.io"

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#315fce"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "HuBot Lab studies human-centered robotics and physical intelligence, using humanoid robots as its flagship platform."
address: "Research Building, Room 105, Soongsil University, Seoul, Republic of Korea"
baseurl: ""
url: "https://hubot-lab.github.io"
lang: "en"

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: research
    label: Research
  - name: team
    label: People
  - name: publications
    label: Publications
  - name: join
    label: Join Us

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Jung
  first_name: [Donghwi]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
