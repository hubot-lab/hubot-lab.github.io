<nav class="navbar sticky-top navbar-expand-md">
  <div class="container" style="max-width: var(--container-max);">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      <img class="navbar-brand-icon" src="{{ '/header-icon.png' | relative_url }}" alt="" width="28" height="28" aria-hidden="true">
      <span>HuBot Lab</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        </li>
        {% for nav in site.nav_pages %}
        <li class="nav-item">
          <a class="nav-link{% if page.url contains nav.name %} active{% endif %}" href="{{ nav.name | prepend: '/' | append: '/' | relative_url }}">{{ nav.label | default: nav.name | capitalize }}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="d-flex align-items-center" style="gap: var(--space-2);">
        {% if site.dark_mode %}
        <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
